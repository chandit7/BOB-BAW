<div class="dt-container">
  <!-- Header: title + record count + refresh -->
  <div class="dt-header">
    <div class="dt-title-area">
      <span class="dt-title"></span>
      <span class="dt-record-count"></span>
    </div>
    <div class="dt-toolbar">
      <button class="dt-btn-icon dt-btn-refresh" title="Refresh">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path d="M8 3v2.5L11.5 2 8 0v2.5C4.5 2.5 1.5 5.5 1.5 9s3 6.5 6.5 6.5c2.8 0 5.2-1.8 6.1-4.3h-1.6c-.8 1.6-2.4 2.8-4.5 2.8-2.8 0-5-2.2-5-5s2.2-5 5-5z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="dt-loading-overlay">
    <div class="dt-spinner"></div>
    <span class="dt-loading-msg">Loading data...</span>
  </div>

  <!-- Scrollable table wrapper -->
  <div class="dt-table-wrap">
    <table class="dt-table">
      <thead class="dt-thead"></thead>
      <tbody class="dt-tbody"></tbody>
    </table>
  </div>

  <!-- Pagination bar -->
  <div class="dt-pagination">
    <div class="dt-page-info"></div>
    <div class="dt-page-size-wrap">
      <label>Rows per page:</label>
      <select class="dt-pagesize">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="250">250</option>
        <option value="500">500</option>
      </select>
    </div>
    <div class="dt-page-nav">
      <button class="dt-btn-prev">◀ Previous</button>
      <span class="dt-indicator">Page — of —</span>
      <button class="dt-btn-next">Next ▶</button>
    </div>
  </div>
</div>
