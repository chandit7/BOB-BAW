<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <defs>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#tableBg)"/>
  
  <!-- Table container -->
  <rect x="10" y="14" width="44" height="36" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  
  <!-- Table header -->
  <rect x="10" y="14" width="44" height="8" rx="2" fill="url(#headerGradient)"/>
  
  <!-- Header columns -->
  <line x1="24" y1="14" x2="24" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="14" x2="40" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  
  <!-- Sort indicator on first column -->
  <path d="M 15 17 L 17 19 L 19 17" stroke="#ffffff" stroke-width="1" fill="none"/>
  
  <!-- Table rows -->
  <line x1="10" y1="28" x2="54" y2="28" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="10" y1="35" x2="54" y2="35" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="10" y1="42" x2="54" y2="42" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Column separators -->
  <line x1="24" y1="22" x2="24" y2="50" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="40" y1="22" x2="40" y2="50" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Data cells (represented by small rectangles) -->
  <!-- Row 1 -->
  <rect x="12" y="24" width="10" height="2" rx="1" fill="#525252"/>
  <rect x="26" y="24" width="12" height="2" rx="1" fill="#525252"/>
  <circle cx="47" cy="25" r="2.5" fill="#24a148"/>
  
  <!-- Row 2 -->
  <rect x="12" y="31" width="10" height="2" rx="1" fill="#525252"/>
  <rect x="26" y="31" width="12" height="2" rx="1" fill="#525252"/>
  <circle cx="47" cy="32" r="2.5" fill="#0f62fe"/>
  
  <!-- Row 3 -->
  <rect x="12" y="38" width="10" height="2" rx="1" fill="#525252"/>
  <rect x="26" y="38" width="12" height="2" rx="1" fill="#525252"/>
  <circle cx="47" cy="39" r="2.5" fill="#da1e28"/>
  
  <!-- Row 4 -->
  <rect x="12" y="45" width="10" height="2" rx="1" fill="#525252"/>
  <rect x="26" y="45" width="12" height="2" rx="1" fill="#525252"/>
  <circle cx="47" cy="46" r="2.5" fill="#f1c21b"/>
  
  <!-- Pagination indicator at bottom -->
  <circle cx="28" cy="56" r="1.5" fill="#8d8d8d"/>
  <circle cx="32" cy="56" r="1.5" fill="#0f62fe"/>
  <circle cx="36" cy="56" r="1.5" fill="#8d8d8d"/>
  
  <!-- Dynamic data indicator (small database icon) -->
  <ellipse cx="58" cy="12" rx="4" ry="2.5" fill="#0f62fe" opacity="0.8"/>
  <ellipse cx="58" cy="14" rx="4" ry="2.5" fill="#0f62fe" opacity="0.6"/>
  <rect x="54" y="12" width="8" height="4" fill="#0f62fe" opacity="0.7"/>
</svg>

